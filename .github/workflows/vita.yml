name: Vita build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      addr2line:
        description: "Space-separated ELF addresses to symbolize (for crash dumps)"
        required: false
        default: ""

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        run: |
          if command -v apk >/dev/null; then apk add --no-cache make git bash coreutils
          elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y make git
          fi
          ls "$VITASDK/arm-vita-eabi/lib" | grep -i sdl2 || vdpm SDL2

      - uses: actions/checkout@v4

      - name: Build VPK
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./platform/PSVita/build.sh

      - name: Symbolize crash addresses
        if: ${{ inputs.addr2line != '' }}
        run: |
          for a in ${{ inputs.addr2line }}; do
            echo "== $a"
            "$VITASDK/bin/arm-vita-eabi-addr2line" -f -C -i -e eduke32.elf "$a"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dna-vita
          path: |
            build/vita/dna-vita.vpk
            eduke32.elf
