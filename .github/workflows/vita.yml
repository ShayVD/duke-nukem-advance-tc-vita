name: Vita build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      addr2line:
        description: "Space-separated ELF addresses to symbolize (for crash dumps)"
        required: false
        default: ""

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        run: |
          if command -v apk >/dev/null; then apk add --no-cache make git bash coreutils
          elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y make git
          fi
          ls "$VITASDK/arm-vita-eabi/lib" | grep -i sdl2 || vdpm SDL2

      - uses: actions/checkout@v4

      - name: Build VPK
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./platform/PSVita/build.sh

      - name: Symbolize crash addresses
        if: ${{ inputs.addr2line != '' }}
        run: |
          for a in ${{ inputs.addr2line }}; do
            echo "== $a"
            "$VITASDK/bin/arm-vita-eabi-addr2line" -f -C -i -e eduke32.elf "$a"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dna-vita
          path: |
            build/vita/dna-vita.vpk
            eduke32.elf

  # Pushing a tag like v1.0 publishes a GitHub release with the VPK attached.
  # GitHub adds the source code archives to every release, which keeps the GPL source next to the VPK.
  release:
    needs: vpk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dna-vita

      - uses: softprops/action-gh-release@v2
        with:
          name: Duke Nukem Advance for PS Vita ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: build/vita/dna-vita.vpk
          fail_on_unmatched_files: true
